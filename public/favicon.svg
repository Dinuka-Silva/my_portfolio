<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Main Neon Gradient -->
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9f" />
      <stop offset="100%" stop-color="#00d9ff" />
    </linearGradient>

    <!-- Subtle Accent Gradient -->
    <linearGradient id="glow-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00ff9f" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow / Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hexagonal Shield Boundary -->
  <path 
    d="M64 8 L114 30 V78 C114 102 92 118 64 122 C36 118 14 102 14 78 V30 Z" 
    fill="#050505" 
    stroke="url(#cyber-gradient)" 
    stroke-width="5" 
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <!-- Inner Cyber Tech Lines -->
  <path 
    d="M64 18 L102 35 V75 C102 93 85 106 64 110 C43 106 26 93 26 75 V35 Z" 
    fill="none" 
    stroke="url(#glow-gradient)" 
    stroke-width="2" 
    stroke-dasharray="8 4 4 4"
    opacity="0.7"
  />

  <!-- Central Security Shield Core & Terminal Icon -->
  <g filter="url(#neon-glow)">
    <!-- Terminal '>' Symbol -->
    <path 
      d="M48 48 L72 64 L48 80" 
      fill="none" 
      stroke="#00ff9f" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- Pulse Terminal Underscore Cursor '_' -->
    <path 
      d="M80 80 H96" 
      fill="none" 
      stroke="#00d9ff" 
      stroke-width="8" 
      stroke-linecap="round"
    />
  </g>
</svg>
